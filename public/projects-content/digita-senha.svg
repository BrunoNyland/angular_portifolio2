<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="DigitaSenha">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b111e"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#512bd4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="780" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#acc)"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#e2e8f0">
    <text x="80" y="120" font-size="28" letter-spacing="3" fill="#94a3b8">DIGITASENHA · C# / .NET 10</text>
    <text x="80" y="200" font-size="64" font-weight="700" letter-spacing="-2">Automação Windows</text>
    <text x="80" y="266" font-size="24" fill="#cbd5e1">WPF-UI · Hotkeys Globais · Tray Icon · InputSimulator</text>
  </g>
  <g stroke="#1e293b" stroke-width="1" fill="#0f172a">
    <!-- Window Header -->
    <rect x="80" y="320" width="1040" height="40" rx="8"/>
    <!-- Settings Panel -->
    <rect x="80" y="375" width="680" height="250" rx="8"/>
    <!-- Window Mappings list -->
    <rect x="780" y="375" width="340" height="250" rx="8"/>
  </g>
  <!-- Window dots (WPF / Windows style) -->
  <circle cx="108" cy="340" r="5" fill="#ef4444"/>
  <circle cx="128" cy="340" r="5" fill="#f59e0b"/>
  <circle cx="148" cy="340" r="5" fill="#10b981"/>
  <text x="175" y="345" font-family="ui-monospace, monospace" font-size="14" fill="#64748b">DigitaSenha — Configurações (.NET 10 WPF-UI)</text>

  <g fill="#334155">
    <rect x="110" y="405" width="220" height="12" rx="2"/>
    <rect x="110" y="430" width="360" height="32" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="110" y="480" width="220" height="12" rx="2"/>
    <rect x="110" y="505" width="360" height="32" rx="4" fill="#1e293b" stroke="#334155"/>

    <rect x="805" y="405" width="180" height="12" rx="2"/>
    <rect x="805" y="430" width="290" height="24" rx="4" fill="#1e293b"/>
    <rect x="805" y="465" width="290" height="24" rx="4" fill="#1e293b"/>
    <rect x="805" y="500" width="290" height="24" rx="4" fill="#1e293b"/>
  </g>

  <!-- Hotkey Pill -->
  <rect x="500" y="430" width="140" height="32" rx="6" fill="#512bd4"/>
  <text x="530" y="451" font-family="ui-monospace, monospace" font-size="14" font-weight="bold" fill="#ffffff">ATALHO: Pause</text>

  <!-- Status badges -->
  <rect x="110" y="565" width="150" height="36" rx="6" fill="#38bdf8"/>
  <text x="132" y="588" font-family="ui-monospace, monospace" font-size="14" font-weight="bold" fill="#0f172a">SALVAR &amp; OK</text>
  <rect x="280" y="565" width="190" height="36" rx="6" fill="#1e293b" stroke="#38bdf8"/>
  <text x="296" y="588" font-family="ui-monospace, monospace" font-size="14" font-weight="bold" fill="#38bdf8">TRAY (SEGUNDO PLANO)</text>

  <text x="80" y="752" font-family="ui-monospace, monospace" font-size="16" fill="#64748b">2026 · Bruno Nyland</text>
</svg>
