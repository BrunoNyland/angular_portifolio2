<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="RA Beach Tennis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1310"/>
      <stop offset="1" stop-color="#070c09"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="780" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#acc)"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#e5eef0">
    <text x="80" y="120" font-size="28" letter-spacing="3" fill="#8ca39a">RA BEACH TENNIS · rabeachtennis.com</text>
    <text x="80" y="200" font-size="64" font-weight="700" letter-spacing="-2">Plataforma &amp; PWA</text>
    <text x="80" y="266" font-size="24" fill="#9db5ab">Angular 22 · Django API · PostgreSQL · WhatsApp</text>
  </g>
  <g stroke="#1a2e26" stroke-width="1" fill="#0f1f19">
    <!-- Header app bar mockup -->
    <rect x="80" y="320" width="1040" height="54" rx="8"/>
    <!-- Quadra 1 reservation slot card -->
    <rect x="80" y="394" width="330" height="230" rx="8"/>
    <!-- Quadra 2 reservation slot card -->
    <rect x="435" y="394" width="330" height="230" rx="8"/>
    <!-- Notifications/Stats card -->
    <rect x="790" y="394" width="330" height="230" rx="8"/>
  </g>
  <g fill="#27473b">
    <rect x="108" y="340" width="140" height="14" rx="3"/>
    <rect x="108" y="420" width="180" height="16" rx="3"/>
    <rect x="108" y="450" width="260" height="10" rx="2"/>
    <rect x="108" y="470" width="220" height="10" rx="2"/>
    <rect x="463" y="420" width="180" height="16" rx="3"/>
    <rect x="463" y="450" width="260" height="10" rx="2"/>
    <rect x="463" y="470" width="200" height="10" rx="2"/>
    <rect x="818" y="420" width="180" height="16" rx="3"/>
    <rect x="818" y="450" width="240" height="10" rx="2"/>
  </g>
  <!-- Accent status badges -->
  <rect x="108" y="560" width="100" height="32" rx="6" fill="#10b981"/>
  <text x="124" y="581" font-family="ui-monospace, monospace" font-size="14" font-weight="bold" fill="#042f2e">RESERVAR</text>
  <rect x="463" y="560" width="100" height="32" rx="6" fill="#f59e0b"/>
  <text x="479" y="581" font-family="ui-monospace, monospace" font-size="14" font-weight="bold" fill="#451a03">OCUPADA</text>
  <rect x="818" y="560" width="130" height="32" rx="6" fill="#22c55e"/>
  <text x="834" y="581" font-family="ui-monospace, monospace" font-size="14" font-weight="bold" fill="#052e16">WHATSAPP ON</text>
  <text x="80" y="752" font-family="ui-monospace, monospace" font-size="16" fill="#68877b">2026 · Bruno Nyland</text>
</svg>
